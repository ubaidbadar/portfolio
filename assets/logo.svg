<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ubaid Badar">
  <defs>
    <radialGradient id="bg" cx="72%" cy="22%" r="95%">
      <stop offset="0" stop-color="#3a2bd0"/>
      <stop offset=".55" stop-color="#150f4a"/>
      <stop offset="1" stop-color="#06080f"/>
    </radialGradient>
    <linearGradient id="face" x1="12" y1="14" x2="54" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#b9fff3"/>
      <stop offset="1" stop-color="#7dffe9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#c04dff" stop-opacity=".6"/>
    </linearGradient>
    <!-- U and B share one spine: a single continuous ligature -->
    <path id="ub" d="M15 15v20a10 10 0 0 0 20 0V15v30M35 15h6.5a7.5 7.5 0 0 1 0 15H35h8.5a7.5 7.5 0 0 1 0 15H35"/>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="31.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <g fill="none" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(32 32) scale(.78) translate(-35 -29)">
    <!-- stacked echoes: the same layered-stack idea as the site's hero -->
    <use href="#ub" stroke="#c04dff" transform="translate(6 -6)" opacity=".55"/>
    <use href="#ub" stroke="#6c5cff" transform="translate(3 -3)"/>
    <use href="#ub" stroke="url(#face)"/>
  </g>
</svg>
